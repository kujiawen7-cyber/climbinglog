<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>攀岩日志 · Rock Log</title>
<meta name="description" content="个人攀岩训练日志：记录每次攀爬、装备成本核算、数据看板与进阶追踪">
<style>
/* ============ 攀岩日志 Web · 全局样式 ============ */
:root {
  --brand: #2196F3;         /* 岩壁橙 */
  --brand-dark: #D24A1F;
  --brand-light: #FFE8DC;
  --blue: #2F6FED;
  --blue-light: #E5EEFF;
  --green: #2FA17E;
  --green-light: #D9F2E6;
  --rock: #2B2B34;          /* 标题/正文 */
  --rock-2: #5A5A63;        /* 次要文字 */
  --muted: #8C8C86;
  --bg: #F6F5F2;
  --card: #FFFFFF;
  --line: #ECE9E3;
  --danger: #C0524A;
  --shadow: 0 4px 16px rgba(58,58,64,.06);
  --radius: 16px;
  --sidebar-w: 224px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--rock);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 15px; color: var(--rock); }

/* ---------- 布局 ---------- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
  background: #1F1F27; color: #D8D8DE;
  display: flex; flex-direction: column;
  padding: 20px 16px; z-index: 20;
}
.main { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
.main-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 28px; background: var(--bg);
  position: sticky; top: 0; z-index: 10;
}
.head-title h1 { font-size: 22px; font-weight: 700; }
.head-sub { font-size: 13px; color: var(--muted); }
.head-actions { display: flex; gap: 10px; }
.page-body { padding: 8px 28px 48px; max-width: 1120px; width: 100%; margin: 0 auto; }

/* ---------- 侧边栏 ---------- */
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 6px 22px; }
.brand-logo { font-size: 26px; }
.brand-name { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
.side-nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: 12px;
  color: #A9A9B3; font-size: 15px; cursor: pointer;
  background: none; border: none; text-align: left; width: 100%;
  transition: background .15s, color .15s;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: var(--brand); color: #fff; font-weight: 600; }
.nav-ico { width: 20px; text-align: center; }
.side-foot { padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); }
.side-tip { font-size: 11px; color: #6C6C78; text-align: center; margin-top: 10px; }

/* ---------- 底部导航（移动端） ---------- */
.bottom-nav {
  display: none; position: fixed; left: 0; right: 0; bottom: 0;
  background: #fff; border-top: 1px solid var(--line);
  z-index: 20; padding-bottom: env(safe-area-inset-bottom);
}
.bn-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 6px; font-size: 11px; color: var(--muted); cursor: pointer;
  background: none; border: none;
}
.bn-item.active { color: var(--brand); font-weight: 600; }
.bn-ico { font-size: 19px; }

/* ---------- 通用组件 ---------- */
.card {
  background: var(--card); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.card-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-title .sub { font-size: 12px; color: var(--muted); font-weight: 400; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: none; border-radius: 12px; padding: 10px 18px;
  font-size: 14px; font-weight: 600; transition: transform .1s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-dark); }
.btn-ghost { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); }
.btn-ghost:hover { background: var(--brand-light); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-soft { background: #F1EFEA; color: var(--rock); }
.btn-danger-soft { background: #FCEAE7; color: var(--danger); }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn-block { width: 100%; }
.w-full { width: 100%; }
.link { color: var(--blue); cursor: pointer; font-size: 13px; background: none; border: none; }
.link-danger { color: var(--danger); }
.muted { color: var(--muted); }
.tiny { font-size: 12px; }
.t-bold { font-weight: 700; }
.row { display: flex; gap: 10px; align-items: center; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.gap-8 { gap: 8px; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-20 { margin-top: 20px; }
.mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
}
.tag-brand { background: var(--brand-light); color: var(--brand); }
.tag-blue { background: var(--blue-light); color: var(--blue); }
.tag-green { background: var(--green-light); color: var(--green); }
.tag-gray { background: #F1EFEA; color: var(--muted); }
.tag-red { background: #FCEAE7; color: var(--danger); }

.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

.stat-card { text-align: left; }
.stat-num { font-size: 32px; font-weight: 800; line-height: 1.2; }
.stat-label { font-size: 13px; color: var(--muted); margin-top: 2px; }

.progress { height: 8px; background: #F1EFEA; border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand), #FFA25E); }

.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 4px; border-bottom: 1px solid var(--line);
}
.list-item:last-child { border-bottom: none; }
.list-item .grow { flex: 1; min-width: 0; }

.empty {
  text-align: center; padding: 48px 20px; color: var(--muted);
}
.empty .ico { font-size: 44px; }

/* 表格 */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--line); font-size: 13px; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:hover td { background: #FAF9F7; }

/* 表单 */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--rock-2); }
.field .req { color: var(--danger); }
.input, .select, .textarea {
  width: 100%; border: 1.5px solid #E3DFD7; border-radius: 10px;
  padding: 10px 12px; background: #fff; outline: none; transition: border .15s;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--brand); }
.textarea { min-height: 80px; resize: vertical; }
.input-group { display: flex; gap: 8px; }

/* 分段器 */
.seg { display: flex; background: #F1EFEA; border-radius: 12px; padding: 3px; gap: 3px; }
.seg-item {
  flex: 1; text-align: center; padding: 8px 6px; border-radius: 9px;
  font-size: 13px; font-weight: 600; color: var(--rock-2); background: none; border: none;
}
.seg-item.active { background: #fff; color: var(--brand); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 6px 14px; border-radius: 999px; background: #F1EFEA;
  font-size: 13px; cursor: pointer; border: none; color: var(--rock);
  transition: all .12s;
}
.chip.active { background: var(--brand-light); color: var(--brand); font-weight: 600; }
.chip-blue.active { background: var(--blue-light); color: var(--blue); }

/* 进度/成本条 */
.cost-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; }

/* ---------- 弹层 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.48);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100; padding: 0;
}
.modal {
  background: #fff; border-radius: 20px 20px 0 0;
  width: 100%; max-width: 640px; max-height: 92vh;
  display: flex; flex-direction: column;
  animation: slideUp .22s ease;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 12px; border-bottom: 1px solid var(--line);
}
.modal-head h3 { font-size: 17px; }
.modal-close { background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; }
.modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
.modal-foot { padding: 12px 20px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }
.modal-sm .modal { max-width: 460px; }
.modal-lg .modal { max-width: 860px; }

/* 向导 step 指示 */
.steps { display: flex; gap: 6px; margin-bottom: 16px; }
.step-dot { flex: 1; height: 5px; border-radius: 999px; background: #F1EFEA; }
.step-dot.active { background: var(--brand); }
.step-dot.done { background: var(--blue); }

/* 岩馆选择卡片 */
.gym-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.gym-card {
  border: 2px solid var(--line); border-radius: 14px; padding: 14px;
  cursor: pointer; transition: all .12s; background: #fff;
}
.gym-card:hover { border-color: var(--brand); }
.gym-card.selected { border-color: var(--brand); background: var(--brand-light); }
.gym-card .g-name { font-weight: 700; }
.gym-card .g-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* 线路编辑条目 */
.route-edit {
  border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px;
  background: #FCFBF9; position: relative;
}
.route-edit .re-head { display: flex; gap: 8px; flex-wrap: wrap; }
.route-edit input, .route-edit select { padding: 7px 10px; font-size: 13px; }
.re-grade { width: 90px; } .re-color { width: 70px; } .re-attempt { width: 64px; }
.re-del { position: absolute; top: 8px; right: 8px; }

/* 统计 */
.chart-box { width: 100%; overflow-x: auto; }
.chart-svg { display: block; width: 100%; height: auto; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--rock-2); margin-top: 6px; }
.legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }

/* 徽章 */
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.badge-card {
  border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; text-align: center;
  background: #fff;
}
.badge-card.locked { opacity: .4; filter: grayscale(1); }
.badge-card .b-ico { font-size: 32px; }
.badge-card .b-name { font-weight: 700; font-size: 14px; margin-top: 6px; }
.badge-card .b-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* 时间轴 */
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl-item { position: relative; padding-bottom: 16px; }
.tl-item::before {
  content: ""; position: absolute; left: -21px; top: 5px;
  width: 12px; height: 12px; border-radius: 50%; background: var(--brand);
  border: 3px solid var(--brand-light);
}
.tl-date { font-size: 12px; color: var(--muted); }
.tl-title { font-weight: 700; }

/* 装备卡 */
.gear-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.gear-card { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; background: #fff; }
.gear-card .g-name { font-weight: 700; font-size: 15px; }
.gear-card .g-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Toast */
#toastWrap { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: #2B2B34; color: #fff; padding: 10px 20px; border-radius: 999px;
  font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.18); animation: toastIn .2s ease;
  max-width: 86vw;
}
@keyframes toastIn { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* 海报画布隐藏 */
#posterCanvas { position: fixed; left: -9999px; top: -9999px; }

/* 搜索框 */
.search-box { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid #E3DFD7; border-radius: 12px; padding: 8px 12px; flex: 1; min-width: 160px; }
.search-box input { border: none; outline: none; background: none; flex: 1; }

/* 响应式 */
@media (min-width: 720px) {
  .modal-mask { align-items: center; padding: 20px; }
  .modal { border-radius: 20px; }
}
@media (max-width: 900px) {
  :root { --sidebar-w: 74px; }
  .brand-name, .nav-item .nav-txt, .side-tip { display: none; }
  .nav-item { justify-content: center; }
  .side-foot .btn { font-size: 0; padding: 12px; }
}
@media (max-width: 719px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .bottom-nav { display: flex; }
  .main-head { padding: 16px 16px; }
  .page-body { padding: 8px 14px 90px; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
  .head-actions .btn-primary { font-size: 0; padding: 10px 14px; }
  .head-actions .btn-primary::after { content: "＋"; font-size: 18px; }
}

/* ---------- RPE 点选条 & 推荐卡 ---------- */
.rpe-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.rpe-dot {
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid #BBDEFB;
  background: #fff; color: #1565C0; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s; padding: 0; flex: 0 0 auto;
}
.rpe-dot:active { transform: scale(0.92); }
.rpe-dot.in-range { border-color: #2196F3; background: #E3F2FD; font-weight: 800; box-shadow: 0 0 0 3px rgba(33,150,243,.18); }
.rpe-dot.active { background: #2196F3; border-color: #2196F3; color: #fff; }
.rpe-rec-card {
  margin: 0 0 12px; padding: 10px 12px; border-radius: 12px;
  background: #E3F2FD; border: 1px solid #BBDEFB; color: #0D47A1;
  font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.rpe-rec-card .btn-sm { padding: 4px 12px; font-size: 12px; border-radius: 8px; }

</style>
</head>

  <script>

/* Canvas roundRect polyfill（旧版 Safari 兼容） */
if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y); this.arcTo(x + w, y, x + w, y + r, r);
    this.lineTo(x + w, y + h - r); this.arcTo(x + w, y + h, x + w - r, y + h, r);
    this.lineTo(x + r, y + h); this.arcTo(x, y + h, x, y + h - r, r);
    this.lineTo(x, y + r); this.arcTo(x, y, x + r, y, r);
    this.closePath();
    return this;
  };
}

/* ============ utils.js — 工具函数 ============ */

/* ---------- 格式化 ---------- */
const fmt = {
  date(d) {
    if (!d) return '';
    if (d instanceof Date) d = toDateStr(d);
    const [y, m, day] = String(d).slice(0, 10).split('-');
    if (!y || !m || !day) return String(d);
    const dt = new Date(y, m - 1, day);
    const wd = ['日', '一', '二', '三', '四', '五', '六'][dt.getDay()];
    return `${Number(m)}月${Number(day)}日 周${wd}`;
  },
  monthCn(m) { // 'YYYY-MM' -> 'YYYY年M月'
    if (!m) return '';
    const [y, mm] = String(m).split('-');
    return `${y}年${Number(mm)}月`;
  },
  money(n) {
    const v = Number(n) || 0;
    return '¥' + (Number.isInteger(v) ? v : v.toFixed(2));
  },
  count(n) { return String(Number(n) || 0); },
  pct(n) { return Math.round((Number(n) || 0) * 100) + '%'; },
};

function toDateStr(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function todayStr() { return toDateStr(); }
function currentMonth() { return todayStr().slice(0, 7); }
function daysBetween(a, b) {
  const A = new Date(String(a).replace(/-/g, '/'));
  const B = new Date(String(b).replace(/-/g, '/'));
  return Math.floor((B - A) / 86400000);
}

/* 香蕉攀岩等级换算表（参考图三：香蕉攀岩难度等级示意图）
   香蕉攀岩馆内等级 1-15 与 V 级对应关系：
   1-2 → V0 | 3-4 → V1 | 5-6 → V2 | 7-8 → V3
   9-10 → V4 | 11-12 → V5 | 13-14 → V6 | 15 → V7
*/
const BANANA_GRADES = {
  '1-2': 'V0', '3-4': 'V1', '5-6': 'V2', '7-8': 'V3',
  '9-10': 'V4', '11-12': 'V5', '13-14': 'V6', '15': 'V7',
};
const BANANA_TO_V = Object.fromEntries(Object.entries(BANANA_GRADES).map(([k, v]) => [v, k]));

function bananaToV(bananaGrade) { return BANANA_GRADES[bananaGrade] || ''; }
function vToBanana(vGrade) { return BANANA_TO_V[vGrade] || ''; }

/* ---------- 等级解析（V / YDS / Font / 法国） ---------- */
const GRADES = {
  v: ['V0', 'V1', 'V2', 'V3', 'V4', 'V5', 'V6', 'V7'],
  font: ['4', '5', '6A', '6B', '6C', '7A', '7B', '7C', '8A', '8B', '8C', '9A'],
  yds: ['5.7', '5.8', '5.9', '5.10a', '5.10b', '5.10c', '5.10d', '5.11a', '5.11b', '5.11c', '5.11d', '5.12a', '5.12b', '5.12c', '5.12d', '5.13a', '5.13b', '5.13c', '5.13d', '5.14a', '5.14b', '5.14c', '5.14d', '5.15a', '5.15b', '5.15c', '5.15d'],
  french: ['5c', '6a', '6a+', '6b', '6b+', '6c', '6c+', '7a', '7a+', '7b', '7b+', '7c', '7c+', '8a', '8a+', '8b', '8b+', '8c', '8c+', '9a'],

    .sort((a, b) => (gradeValue(a.grade, system) || 0) - (gradeValue(b.grade, system) || 0));
}

function styleAnalysis() {
  const map = {};
  db.routes.filter((r) => r.completion === 'flash' || r.completion === 'redpoint').forEach((r) => {
    (r.styles || []).forEach((st) => { map[st] = (map[st] || 0) + 1; });
  });
  return Object.entries(map).map(([k, v]) => ({ key: k, value: v })).sort((a, b) => b.value - a.value);
}

function gymTop(n = 5) {
  const map = {};
  db.sessions.forEach((s) => {
    const name = s.gymName || '未知';
    map[name] = map[name] || { name, count: 0, days: new Set() };
    map[name].count++;
    if (s.date) map[name].days.add(s.date);
  });
  return Object.values(map).map((v) => ({ ...v, days: v.days.size })).sort((a, b) => b.count - a.count).slice(0, n);
}

function milestones(system) {
  const sent = db.routes
    .filter((r) => r.gradeSystem === system && (r.completion === 'flash' || r.completion === 'redpoint'))
    .map((r) => ({ ...r, date: (getSession(r.sessionId) || {}).date || '' }))
    .sort((a, b) => a.date.localeCompare(b.date));
  let best = -Infinity;
  const out = [];
  sent.forEach((r) => {
    const v = gradeValue(r.grade, system);
    if (v === null || v <= best) return;
    best = v;
    out.push({ date: r.date, grade: r.grade, gradeSystem: system, routeName: r.routeName, gymName: (getSession(r.sessionId) || {}).gymName || '' });
  });
  return out;
}

function overallStats() {
  const sessions = db.sessions;
  const routes = db.routes;
  const sent = routes.filter((r) => r.completion === 'flash' || r.completion === 'redpoint');
  return {
    sessionCount: sessions.length,
    climbDays: new Set(sessions.map((s) => s.date)).size,
    routeCount: routes.length,
    sentCount: sent.length,
    attemptTotal: routes.reduce((s, r) => s + (Number(r.attempts) || 1), 0),
    venueCount: new Set(sessions.map((s) => s.gymName).filter(Boolean)).size,
  };
}

/* ---------- 项目线路攻坚进度 ---------- */
function projectProgress(routeName, grade, gradeSystem) {
  const attempts = db.routes
    .filter((r) => r.routeName === routeName && r.grade === grade && r.gradeSystem === gradeSystem)
    .map((r) => ({ ...r, date: (getSession(r.sessionId) || {}).date || '' }))
    .sort((a, b) => a.date.localeCompare(b.date));
  if (!attempts.length) return null;
  const totalAttempts = attempts.reduce((s, a) => s + (Number(a.attempts) || 1), 0);
  const sessionCount = new Set(attempts.map((a) => a.sessionId)).size;
  const dates = attempts.map((a) => a.date).filter(Boolean);
  const first = new Date(String(dates[0]).replace(/-/g, '/'));
  const last = new Date(String(dates[dates.length - 1]).replace(/-/g, '/'));
  const weeks = Math.max(0, Math.ceil((last - first) / 6048e5));
  const gv = gradeValue(grade, gradeSystem);
  const expected = gv === null ? 10 : Math.max(3, Math.pow(1.8, Math.max(0, gv - 1)) * 2);
  const progress = Math.min(100, Math.round((totalAttempts / expected) * 100));
  const lastR = attempts[attempts.length - 1];
  const status = (lastR.completion === 'flash' || lastR.completion === 'redpoint') ? 'sent'
    : progress >= 80 ? 'almost' : progress >= 50 ? 'halfway' : 'early';
  const statusLabel = { sent: '已完攀', almost: '即将突破', halfway: '攻坚过半', early: '初期攻坚' }[status];
  return { routeName, grade, gradeSystem, totalAttempts, sessionCount, weeks, progress, status, statusLabel };
}

function findProjects() {
  const map = {};
  db.routes.forEach((r) => {
    if ((r.completion === 'flash' || r.completion === 'redpoint')) return;
    const key = r.routeName + '|' + r.grade + '|' + r.gradeSystem;
    map[key] = map[key] || { routeName: r.routeName, grade: r.grade, gradeSystem: r.gradeSystem };
  });
  return Object.values(map).map((p) => projectProgress(p.routeName, p.grade, p.gradeSystem)).filter(Boolean);
}

/* ---------- 汇率/成本装备效能 ---------- */
function shoeEfficiency() {
  return db.shoes.map((shoe) => {
    const resoles = getShoeResoles(shoe._id);
    const reviews = db.reviews.filter((r) => r.shoeId === shoe._id);
    const { realCost, resoleCount } = shoeRealCost(shoe, resoles);
    const perClimb = costPerClimb(shoe, resoles);
    const days = shoeServiceDays(shoe);
    const avgRating = reviews.length ? reviews.reduce((s, r) => s + (Number(r.rating) || 0), 0) / reviews.length : 3;
    return {
      shoe, resoles, realCost, resoleCount, perClimb, days, avgRating: Math.round(avgRating * 10) / 10,
      climbCount: Number(shoe.climbCount) || 0,
    };
  }).sort((a, b) => a.perClimb - b.perClimb);
}

/* ============ charts.js — 零依赖 SVG 图表 ============ */

const CHART_COLORS = ['#E8632A', '#2F6FED', '#2FA17E', '#E8A23D', '#8E6BC7', '#C0524A', '#4FA3C4', '#B8B6AE'];
const svgNS = 'http://www.w3.org/2000/svg';

function svgEl(tag, attrs) {
  const n = document.createElementNS(svgNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function chartShell(w, h, title) {
  const svg = svgEl('svg', { viewBox: `0 0 ${w} ${h}`, class: 'chart-svg', role: 'img' });
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  if (title) {
    const t = svgEl('title', {}); t.textContent = title;
    svg.appendChild(t);
  }
  return svg;
}

/** 纵向柱状图 */
function barChart(container, data, opts = {}) {
  container.innerHTML = '';
  if (!data || !data.length) {
    container.innerHTML = '<div class="empty"><div class="ico">📊</div>暂无数据</div>';
    return;
  }
  const W = 560, H = opts.height || 300;
  const padL = opts.padL || 44, padB = opts.padB || 34, padT = 24, padR = 12;
  const max = Math.max(...data.map((d) => Number(d.value) || 0), 1);
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const svg = chartShell(W, H, opts.title || '柱状图');
  // 网格线
  for (let i = 0; i <= 4; i++) {
    const y = padT + (innerH / 4) * i;
    svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: '#ECE9E3', 'stroke-width': 1 }));
    svg.appendChild(svgEl('text', { x: padL - 6, y: y + 4, 'text-anchor': 'end', 'font-size': 10, fill: '#8C8C86' })).textContent = Math.round(max - (max / 4) * i);
  }
  const n = data.length;
  const slot = innerW / n;
  const bw = Math.min(44, slot * 0.55);
  data.forEach((d, i) => {
    const v = Number(d.value) || 0;
    const bh = max > 0 ? (v / max) * innerH : 0;
    const x = padL + slot * i + (slot - bw) / 2;
    const y = padT + innerH - bh;
    const color = (opts.colors && opts.colors[i]) || CHART_COLORS[i % CHART_COLORS.length];
    const rect = svgEl('rect', { x, y, width: bw, height: Math.max(0, bh), rx: opts.rx || 5, fill: color });
    const title = svgEl('title', {}); title.textContent = `${d.label}: ${d.value}`;
    rect.appendChild(title);
    svg.appendChild(rect);
    const tx = padL + slot * i + slot / 2;
    const ty = padT + innerH + 14;
    const label = svgEl('text', { x: tx, y: ty, 'text-anchor': 'middle', 'font-size': 10, fill: '#5A5A63' });
    label.textContent = d.label;
    svg.appendChild(label);
  });
  container.appendChild(svg);
}

/** 折线图（多序列） */
function lineChart(container, data, series, opts = {}) {
  container.innerHTML = '';
  if (!data || !data.length) {
    container.innerHTML = '<div class="empty"><div class="ico">📈</div>暂无数据</div>';
    return;
  }
  const W = 600, H = opts.height || 280;
  const padL = 40, padB = 30, padT = 20, padR = 14;
  const vals = [];
  series.forEach((s) => data.forEach((d) => vals.push(Number(d[s.key]) || 0)));
  const max = Math.max(...vals, 1);
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const svg = chartShell(W, H, opts.title || '折线图');
  for (let i = 0; i <= 4; i++) {
    const y = padT + (innerH / 4) * i;
    svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: '#ECE9E3', 'stroke-width': 1 }));
    svg.appendChild(svgEl('text', { x: padL - 6, y: y + 4, 'text-anchor': 'end', 'font-size': 10, fill: '#8C8C86' })).textContent = Math.round(max - (max / 4) * i);
  }
  const xFor = (i) => padL + (data.length > 1 ? (innerW * i) / (data.length - 1) : innerW / 2);
  const yFor = (v) => padT + innerH - (max > 0 ? (v / max) * innerH : 0);
  data.forEach((d, i) => {
    const tx = xFor(i), ty = padT + innerH + 16;
    const label = svgEl('text', { x: tx, y: ty, 'text-anchor': 'middle', 'font-size': 10, fill: '#5A5A63' });
    label.textContent = d.label;
    svg.appendChild(label);
  });
  series.forEach((s, si) => {
    const color = s.color || CHART_COLORS[si % CHART_COLORS.length];
    const pts = data.map((d, i) => [xFor(i), yFor(Number(d[s.key]) || 0)]);
    let path = `M ${pts[0][0]} ${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      path += ` L ${pts[i][0]} ${pts[i][1]}`;
    }
    const line = svgEl('path', { d: path, fill: 'none', stroke: color, 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    svg.appendChild(line);
    if (opts.area) {
      const area = svgEl('path', { d: path + ` L ${pts[pts.length - 1][0]} ${padT + innerH} L ${pts[0][0]} ${padT + innerH} Z`, fill: color, opacity: 0.08 });
      svg.appendChild(area);
    }
    pts.forEach((p, pi) => {
      const x = p[0], y = p[1];
      const c = svgEl('circle', { cx: x, cy: y, r: 3.5, fill: '#fff', stroke: color, 'stroke-width': 2 });
      const t = svgEl('title', {}); t.textContent = `${s.name}: ${data[pi][s.key]}`;
      c.appendChild(t);
      svg.appendChild(c);
    });
  });
  container.appendChild(svg);
  // 图例
  const legend = document.createElement('div');
  legend.className = 'chart-legend';
  series.forEach((s, i) => {
    const color = s.color || CHART_COLORS[i % CHART_COLORS.length];
    legend.innerHTML += `<span><span class="legend-dot" style="background:${color}"></span>${s.name}</span>`;
  });
  container.appendChild(legend);
}

/** 环形图 */
function pieChart(container, data, opts = {}) {
  container.innerHTML = '';
  if (!data || !data.length) {
    container.innerHTML = '<div class="empty"><div class="ico">🥧</div>暂无数据</div>';
    return;
  }
  const total = data.reduce((s, d) => s + (Number(d.value) || 0), 0);
  if (!total) { container.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const W = 300, H = 300, cx = W / 2, cy = H / 2;
  const R = 100, r = 62;
  const svg = chartShell(W, H, opts.title || '环形图');
  let angle = -Math.PI / 2;
  data.forEach((d, i) => {
    const frac = (Number(d.value) || 0) / total;
    const a2 = angle + frac * Math.PI * 2;
    const color = (opts.colors && opts.colors[i]) || CHART_COLORS[i % CHART_COLORS.length];
    const path = arcPath(cx, cy, R, angle, a2);
    const hole = arcPath(cx, cy, r, angle, a2).split(' ')[0] + ' Z';
    const seg = svgEl('path', { d: path, fill: color });
    const t = svgEl('title', {}); t.textContent = `${d.label}: ${d.value} (${Math.round(frac * 100)}%)`;
    seg.appendChild(t);
    svg.appendChild(seg);
    angle = a2;
  });
  svg.appendChild(svgEl('circle', { cx, cy, r, fill: '#fff' }));
  svg.appendChild(svgEl('text', { x: cx, y: cy - 4, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: '#2B2B34' })).textContent = total;
  svg.appendChild(svgEl('text', { x: cx, y: cy + 16, 'text-anchor': 'middle', 'font-size': 11, fill: '#8C8C86' })).textContent = '总条数';
  container.appendChild(svg);
  const legend = document.createElement('div');
  legend.className = 'chart-legend';
  data.forEach((d, i) => {
    legend.innerHTML += `<span><span class="legend-dot" style="background:${CHART_COLORS[i % CHART_COLORS.length]}"></span>${d.label} ${d.value}</span>`;
  });
  container.appendChild(legend);
}
function arcPath(cx, cy, r, a1, a2) {
  const large = (a2 - a1) > Math.PI ? 1 : 0;
  const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
  const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
  return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
}

function hBarChart(container, data, opts = {}) {

}

  navigate(page) {
    this.page = page;
    document.querySelectorAll('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.page === page));
    document.querySelectorAll('.bn-item').forEach((n) => n.classList.toggle('active', n.dataset.page === page));
    this.renderHead();
    const body = document.getElementById('pageBody');
    const renderers = {
      home: this.renderHome, log: this.renderLog, stats: this.renderStats,
      gear: this.renderGear, gyms: this.renderGyms, profile: this.renderProfile,
    };
    renderers[page].call(this, body);
    window.scrollTo(0, 0);

  /* ============ 事件委托 ============ */
  onClick(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const act = btn.dataset.action;
    const d = btn.dataset;
    const map = {
      nav: () => this.navigate(d.page),
      'quick-start': () => this.openQuick(),
      'open-shoe-form': () => this.openShoeForm(),
      'open-gear-form': () => this.openGearForm(),
      'open-gym-form': () => this.openGymForm(),
      'save-gym': () => this.saveGym(),
      'save-shoe': () => this.saveShoe(),
      'save-gear': () => this.saveGear(),
      'save-route-edit': () => {},
      'delete-route-edit': () => this.removeQuickRoute(Number(d.idx)),
      'add-quick-route': () => this.addQuickRoute(),
      'quick-next': () => this.quickNext(),
      'quick-prev': () => this.quickPrev(),
      'quick-submit': () => this.quickSubmit(),
      'quick-pick-gym': () => this.quickPickGym(d.id),
      'quick-type': () => {
        const k = d.key || d.type;
        const arr = App.quick.climbType || [];
        const idx = arr.indexOf(k);
        if (idx >= 0) arr.splice(idx, 1); else arr.push(k);
        App.quick.climbType = arr;
        // 单选类型时联动等级体系：抱石→V，先锋/顶绳/自保→YDS
        if (arr.length === 1) App.quick.gradeSystem = arr[0] === 'boulder' ? 'v' : 'yds';
        // 局部更新 chip 状态，避免 full re-render 打断点击事件
        const chips = document.querySelectorAll('[data-action="quick-type"]');
        chips.forEach((c) => c.classList.toggle('active', arr.includes(c.dataset.key || c.dataset.type)));
      },
      'quick-shoe': () => {
        App.quick.shoeId = d.id;
        document.querySelectorAll('[data-action="quick-shoe"]').forEach((c) => c.classList.toggle('active', c.dataset.id === d.id));
      },
      'quick-body': () => {
        App.quick.bodyCondition = d.key;
        document.querySelectorAll('[data-action="quick-body"]').forEach((c) => c.classList.toggle('active', (c.dataset.key || c.dataset.type) === d.key));

      'session-detail': () => this.openSessionDetail(d.id),
      'session-delete': () => this.deleteSessionFlow(d.id),
      'view-session-edit': () => this.editSession(d.id),
      'shoe-detail': () => this.openShoeDetail(d.id),
      'shoe-edit': () => this.openShoeForm(d.id),
      'shoe-resole': () => this.openResole(d.id),
      'shoe-retire': () => this.retireShoe(d.id),
      'shoe-active': () => this.activateShoe(d.id),
      'shoe-delete': () => this.deleteShoeFlow(d.id),
      'shoe-review': () => this.openReview(d.id),
      'gear-detail': () => this.openGearDetail(d.id),
      'gear-edit': () => this.openGearForm(d.id),
      'gear-retire': () => this.retireGear(d.id),
      'gear-delete': () => this.deleteGearFlow(d.id),
      'gym-edit': () => this.openGymForm(d.id),
      'gym-delete': () => this.deleteGymFlow(d.id),
      'gym-fav': () => this.toggleGymFav(d.id),
      'grade-sys': () => this.statsGradeSystem(d.key),
      'profile-save': () => this.saveProfile(),
      'profile-reset': () => this.resetAll(),
      'export-csv': () => this.exportCSV(),
      'export-json': () => this.exportJSON(),
      'month-report': () => this.openMonthReport(),
      'report-download': () => this.downloadReport(),
      'close-modal': () => this.closeModal(),
      'noop': () => {},
    };
    const fn = map[act] || (App.extraActions ? App.extraActions[act] : null);
    if (fn) { e.preventDefault(); fn(btn, d); }

  /* ============ 快速记录向导 ============ */
  openQuick() {
    const sessions = db.sessions.slice().sort((a, b) => b.date.localeCompare(a.date));
    const recentGyms = [];
    sessions.forEach((s) => { if (!recentGyms.find((g) => g.id === s.gymId)) recentGyms.push({ id: s.gymId, name: s.gymName }); });
    const favGyms = db.gyms.filter((g) => g.isFavorite);
    this.quick = {
      step: 1, gymId: '', climbType: ['boulder'], gradeSystem: db.settings.preferredGradeSystem || 'v',
      shoeId: db.settings.defaultShoeId || (db.shoes.find((x) => x.status === 'active') || {})._id || '',
      gearIds: (db.settings.defaultGearIds || []).slice(),
      bodyCondition: 'good', feeling: '', date: todayStr(), timeSlot: 'evening',
      rpe: 0, duration: 60, rpeAnchor: null,
      routes: [{ routeName: '', grade: '', color: '', completion: 'flash', attempts: 1, styles: [], notes: '' }],
    };
    this.quickRecent = recentGyms;
    this.quickRender();

  quickRender() {
    const q = this.quick;
    const body = (q.step === 1) ? this.quickStepHtml1()
      : (q.step === 2) ? this.quickStepHtml2()
      : this.quickStepHtml3();
    const titles = ['选择岩馆', '攀爬类型与装备', '记录线路'];
    const root = this.modal(`
      <div class="modal-head"><h3>快速记录 · ${titles[q.step - 1]}</h3><button class="modal-close" data-action="close-modal">✕</button></div>
      <div class="modal-body">
        <div class="steps">
          ${[1, 2, 3].map((i) => `<span class="step-dot ${i === q.step ? 'active' : i < q.step ? 'done' : ''}"></span>`).join('')}
        </div>
        ${body}
      </div>
      <div class="modal-foot">
        ${q.step > 1 ? `<button class="btn btn-soft" data-action="quick-prev">上一步</button>` : ''}
        ${q.step < 3 ? `<button class="btn btn-primary" data-action="quick-next">下一步</button>` : `<button class="btn btn-primary" data-action="quick-submit">完成记录 ✓</button>`}
      </div>`);
    // RPE 点选条：局部更新，不触发整窗重渲染
    setTimeout(() => {
      const bar = document.getElementById('qRpeBar');
      if (bar && !bar.__bound) {
        bar.__bound = 1;
        bar.addEventListener('click', (ev) => {
          const b = ev.target.closest('.rpe-dot');
          if (!b || !App.quick) return;
          App.quick.rpe = Number(b.dataset.rpe);
          bar.querySelectorAll('.rpe-dot').forEach((x) => x.classList.toggle('active', x === b));
          const hint = document.getElementById('qRpeHint');
          if (hint) hint.textContent = `已选 ${App.quick.rpe} · ${RPE_RANGE_LABELS[App.quick.rpe]}`;

      if (App.quick && App.quick.step === 3) App.refreshRpeAnchor();
    }, 0);

    const q = this.quick;

    const grades = Array.from(document.querySelectorAll('.qr-grade'));
    grades.forEach((sel, i) => { if (q.routes[i]) q.routes[i].grade = sel.value; });

    q.rpeAnchor = rec;
    const card = document.getElementById('qRpeRecCard');
    if (card) {
      card.innerHTML = rec
        ? `💡 根据最高难度 <b>${escapeHTML(rec.grade)}</b>，推荐 RPE <b>${rec.min}–${rec.max}</b>（${rec.label}）<button type="button" class="btn btn-soft btn-sm" data-action="apply-rpe-rec">采用</button>`

  quickPickGym(id) {
    const g = getGym(id);
    if (!g) return;
    this.quick.gymId = id;
    this.quick.gymName = g.name;
    // 智能默认：上次在该馆的类型/系统
    const last = db.sessions.filter((s) => s.gymId === id).sort((a, b) => b.date.localeCompare(a.date))[0];
    if (last) {
      this.quick.climbType = last.climbType;
      this.quick.gradeSystem = last.gradeSystem;
      if (last.shoeId) this.quick.shoeId = last.shoeId;
    }
    this.quickRender();
  },
  quickSetType(key) {
    this.quick.climbType = key;
    this.quick.gradeSystem = key === 'boulder' ? (this.quick.gradeSystem === 'yds' ? 'v' : this.quick.gradeSystem)
      : (this.quick.gradeSystem === 'v' || this.quick.gradeSystem === 'font' ? 'yds' : this.quick.gradeSystem);
    this.quickRender();
  },
  // quickSetShoe / quickSetBody 已内联到 onClick handler 中做局部更新
  quickNext() {
    const q = this.quick;
    if (q.step === 1) {
      if (!q.gymId) { toast('请先选择岩馆'); return; }
      // 兜底：无可用鞋时给空
      q.step = 2; this.quickRender(); return;
    }
    if (q.step === 2) { q.step = 3; this.quickRender(); return; }
  },
  quickPrev() { if (this.quick.step > 1) { this.quick.step--; this.quickRender(); } },

  addQuickRoute() {
    const q = this.quick;
    const last = q.routes[q.routes.length - 1];
    const nextGrade = last.grade ? bumpGrade(last.grade, -1, q.gradeSystem) : '';
    q.routes.push({ routeName: '', grade: nextGrade, color: '', completion: 'redpoint', attempts: 1, styles: [], notes: '' });
    this.quickRender();
  },
  removeQuickRoute(idx) {
    if (this.quick.routes.length <= 1) { toast('至少保留一条线路'); return; }
    this.quick.routes.splice(idx, 1);
    this.quickRender();
  },

  quickSubmit() {
    const q = this.quick;
    if (!q.gymId) return toast('缺少岩馆');
    // 读取表单值
    const qrNames = Array.from(document.querySelectorAll('.qr-name'));
    const qrGrades = Array.from(document.querySelectorAll('.qr-grade'));
    const qrColors = Array.from(document.querySelectorAll('.qr-color'));
    const qrComps = Array.from(document.querySelectorAll('.qr-comp'));
    const qrAttempts = Array.from(document.querySelectorAll('.qr-attempt'));
    q.routes = q.routes.map((r, i) => {
      const grade = qrGrades[i] ? qrGrades[i].value : r.grade;
      const comps = qrComps.filter((c) => Number(c.dataset.i) === i);
      const comp = comps.find((c) => c.classList.contains('active'));
      const styles = Array.from(document.querySelectorAll('.qr-style')).filter((s) => Number(s.dataset.i) === i && s.classList.contains('active')).map((s) => s.dataset.style);
      return {
        routeName: (qrNames[i] ? qrNames[i].value : r.routeName) || '',
        grade, color: qrColors[i] ? qrColors[i].value : r.color,
        completion: comp ? comp.dataset.comp : 'failed',
        attempts: Math.max(1, Number(qrAttempts[i] ? qrAttempts[i].value : r.attempts) || 1),
        styles, notes: '',
      };
    });
    const validRoutes = q.routes.filter((r) => r.routeName.trim() && r.grade);
    if (!validRoutes.length) return toast('至少填写一条有名称和等级的线路');
    const rpe = Math.max(1, Math.min(10, Number(q.rpe) || 0));
    if (!rpe) return toast('请选择 RPE 主观疲劳评分（第 2 步）');
    const duration = Math.max(5, Math.min(600, Number(document.getElementById('qDuration') ? document.getElementById('qDuration').value : q.duration) || 60));
    const rec = rpeRecommendation(validRoutes, q.gradeSystem);
    const shoe = getShoe(q.shoeId);
    const sessionData = {
      date: document.getElementById('qDate') ? document.getElementById('qDate').value : q.date,
      timeSlot: document.getElementById('qTime') ? document.getElementById('qTime').value : q.timeSlot,
      gymId: q.gymId, gymName: q.gymName, climbType: q.climbType, gradeSystem: q.gradeSystem,
      shoeId: q.shoeId || '', shoeName: shoe ? shoe.model : '',
      gearIds: q.gearIds, bodyCondition: q.bodyCondition,
      rpe, duration,
      rpeRecommended: rec ? { min: rec.min, max: rec.max, grade: rec.grade, gradeSystem: rec.gradeSystem } : null,
      feeling: document.getElementById('qFeeling') ? document.getElementById('qFeeling').value : q.feeling,
      notes: document.getElementById('qNotes') ? document.getElementById('qNotes').value : '',
    };
    createSession(sessionData, validRoutes.map((r) => ({ ...r, gradeSystem: sessionData.gradeSystem })));
    refreshGoalProgress();
    const fresh = syncBadges();
    this.closeModal();
    this.quick = null;
    toast(fresh ? `记录完成 + 解锁 ${fresh} 个徽章` : '记录完成 ✓');
    this.navigate('log');
  },

  openMonthReport() {

    const cur = months[0] || currentMonth();
    this._reportMonth = cur;

          ${months.map((m) => `<button class="chip ${m === cur ? 'active' : ''}" data-m="${m}">${fmt.monthCn(m)}</button>`).join('') || '<span class="muted">暂无数据</span>'}

      document.querySelectorAll('#reportMonths .chip').forEach((x) => x.classList.remove('active'));
      c.classList.add('active');
      this._reportMonth = c.dataset.m;
      this.renderReportPreview();
    }));
    this.renderReportPreview();
  },
  reportData(month) {
    const sessions = db.sessions.filter((s) => (s.date || '').startsWith(month));
    const ids = new Set(sessions.map((s) => s._id));
    const routes = db.routes.filter((r) => ids.has(r.sessionId));
    const sent = routes.filter((r) => r.completion === 'flash' || r.completion === 'redpoint');
    const flashN = routes.filter((r) => r.completion === 'flash').length;
    const gradeMap = {};
    sent.forEach((r) => { gradeMap[r.grade] = (gradeMap[r.grade] || 0) + 1; });
    const gymMap = {};
    sessions.forEach((s) => { gymMap[s.gymName] = (gymMap[s.gymName] || 0) + 1; });
    const shoeMap = {};
    sessions.forEach((s) => { if (s.shoeName) shoeMap[s.shoeName] = (shoeMap[s.shoeName] || 0) + 1; });
    const maxV = sent.reduce((best, r) => {
      const v = gradeValue(r.grade, r.gradeSystem);
      return v !== null && v > best.v ? { v, grade: r.grade } : best;
    }, { v: -Infinity, grade: '' });
    const highlights = [];
    if (sessions.length >= 4) highlights.push(`本月出勤 ${sessions.length} 个会话，运动状态稳定 🧗`);
    if (sent.length >= 8) highlights.push(`完攀 ${sent.length} 条线路，状态火热 🔥`);
    if (flashN >= 2) highlights.push(`Flash ${flashN} 条线路，读线出色 ⚡`);
    if (maxV.grade) highlights.push(`最高完攀等级 ${maxV.grade} 🏆`);
    return { month, sessions, routes, sent, flashN, gradeMap, gymMap, shoeMap, maxV: maxV.grade || '—', highlights: highlights.length ? highlights : ['坚持记录，进步就在复盘里 💪'] };
  },
  renderReportPreview() {
    const month = this._reportMonth;
    const d = this.reportData(month);
    const container = document.getElementById('reportPreview');
    if (!container) return;
    const gradeRows = Object.entries(d.gradeMap).sort((a, b) => (gradeValue(a[0], 'v') || 0) - (gradeValue(b[0], 'v') || 0)).slice(0, 6);
    const gymRows = Object.entries(d.gymMap).sort((a, b) => b[1] - a[1]).slice(0, 3);
    container.innerHTML = `
      <div style="background:#2B2B34;border-radius:16px;padding:24px;color:#fff;">
        <div style="font-size:20px;font-weight:800;">🧗 攀岩日志月度报告</div>
        <div style="font-size:12px;color:#A9A9B3;margin-top:4px;">${fmt.monthCn(month)}</div>
        <div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;">
          ${[[d.sessions.length, '会话'], [d.routes.length, '线路'], [d.sent.length, '完攀'], [d.maxV, '最高等级']].map(([v, l]) => `<div style="background:rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;flex:1;min-width:90px;text-align:center;"><div style="font-size:20px;font-weight:800;color:#FF8A3D;">${v}</div><div style="font-size:11px;color:#A9A9B3;">${l}</div></div>`).join('')}
        </div>
        ${gradeRows.length ? `<div style="margin-top:16px;"><div style="font-size:12px;color:#A9A9B3;">完攀等级分布</div>${gradeRows.map(([g, n]) => `<div style="display:flex;align-items:center;margin-top:6px;"><span style="width:52px;font-size:12px;">${g}</span><div class="progress grow" style="background:rgba(255,255,255,.15);"><span style="width:${Math.min(100, n / Math.max(...gradeRows.map((x) => x[1])) * 100)}%;"></span></div><span style="width:30px;text-align:right;font-size:12px;color:#FF8A3D;">${n}</span></div>`).join('')}</div>` : ''}
        ${gymRows.length ? `<div style="margin-top:16px;"><div style="font-size:12px;color:#A9A9B3;">常去地点</div><div style="font-size:13px;margin-top:6px;">${gymRows.map(([n, c]) => `${escapeHTML(n)} ×${c}`).join(' · ')}</div></div>` : ''}
        <div style="margin-top:16px;font-size:13px;line-height:1.8;color:#FFD9C4;">${d.highlights.map((h) => '· ' + h).join('<br>')}</div>
        <div style="margin-top:16px;font-size:10px;color:#666;">由攀岩日志 Web 生成 · ${todayStr()}</div>
      </div>`;
  },
  downloadReport() {
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');
    const d = this.reportData(this._reportMonth);
    ctx.clearRect(0, 0, 600, 900);
    // 背景
    const grad = ctx.createLinearGradient(0, 0, 600, 900);
    grad.addColorStop(0, '#2B2B34'); grad.addColorStop(1, '#1A1A22');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 600, 900);
    // 标题
    ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('🧗 攀岩日志月度报告', 40, 70);
    ctx.fillStyle = '#A9A9B3'; ctx.font = '15px sans-serif';
    ctx.fillText(fmt.monthCn(this._reportMonth), 40, 100);
    // 统计卡
    const cards = [[d.sessions.length, '会话'], [d.routes.length, '线路'], [d.sent.length, '完攀'], [d.maxV, '最高等级']];
    const cardW = 124, gap = 10, startX = 40;
    cards.forEach(([v, l], i) => {
      const x = startX + i * (cardW + gap);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.roundRect(x, 130, cardW, 86, 12); ctx.fill();
      ctx.fillStyle = '#FF8A3D'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(String(v), x + cardW / 2, 172);
      ctx.fillStyle = '#A9A9B3'; ctx.font = '13px sans-serif';
      ctx.fillText(l, x + cardW / 2, 198);
    });
    // 等级分布
    let y = 260;
    const gradeRows = Object.entries(d.gradeMap).sort((a, b) => (gradeValue(a[0], 'v') || 0) - (gradeValue(b[0], 'v') || 0)).slice(0, 5);
    if (gradeRows.length) {
      ctx.fillStyle = '#A9A9B3'; ctx.font = '14px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('完攀等级分布', 40, y);
      const maxN = Math.max(...gradeRows.map((x) => x[1]));
      gradeRows.forEach(([g, n]) => {
        y += 30;
        ctx.fillStyle = '#FFFFFF'; ctx.font = '14px sans-serif';
        ctx.fillText(g, 40, y);
        ctx.fillStyle = '#FF8A3D';
        const bw = 380 * n / maxN;
        ctx.beginPath(); ctx.roundRect(100, y - 12, bw, 16, 8); ctx.fill();
        ctx.fillStyle = '#FF8A3D'; ctx.font = 'bold 13px sans-serif';
        ctx.fillText(String(n), 100 + bw + 8, y + 2);
      });
      y += 16;
    }
    // 地点
    const gymRows = Object.entries(d.gymMap).sort((a, b) => b[1] - a[1]).slice(0, 3);
    if (gymRows.length) {
      y += 12;
      ctx.fillStyle = '#A9A9B3'; ctx.font = '14px sans-serif';
      ctx.fillText('常去地点', 40, y);
      y += 6;
      ctx.fillStyle = '#FFFFFF'; ctx.font = '14px sans-serif';
      ctx.fillText(gymRows.map(([n, c]) => `${n} ×${c}`).join('  ').slice(0, 26), 40, y + 26);
    }
    // 高亮
    y += 60;
    ctx.fillStyle = '#FFD9C4'; ctx.font = '14px sans-serif';
    d.highlights.slice(0, 3).forEach((h) => { ctx.fillText('· ' + h.slice(0, 22), 40, y); y += 28; });
    // 页脚
    ctx.fillStyle = '#66666E'; ctx.font = '11px sans-serif';
    ctx.fillText('由攀岩日志 Web 生成 · ' + todayStr(), 40, 870);
    // 下载
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `climbing-report-${this._reportMonth}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    toast('报告图片已下载');
  },

/* ============ 全局辅助 ============ */
function bumpGrade(grade, delta, system) {
  const list = GRADES[system] || GRADES.v;
  const idx = list.indexOf(grade);
  if (idx < 0) return grade;
  const next = Math.max(0, Math.min(list.length - 1, idx + delta));
  return list[next];
}

  const kw = (v || '').trim().toLowerCase();
  cards.forEach((c) => {
    c.style.display = (!kw || c.textContent.toLowerCase().includes(kw)) ? '' : 'none';
  });
};
window.__qDate = (v) => { if (App.quick) App.quick.date = v; };
window.__qTime = (v) => { if (App.quick) App.quick.timeSlot = v; };
window.__qFeeling = (v) => { if (App.quick) App.quick.feeling = v; };
window.__qDuration = (v) => { if (App.quick) App.quick.duration = Math.max(5, Math.min(600, Number(v) || 60)); };

// 线路难度变更 → 刷新 RPE 推荐卡（step3）
document.addEventListener('change', (e) => {
  if (e.target && e.target.classList && e.target.classList.contains('qr-grade') && App.quick) {
    App.refreshRpeAnchor();
  }
});

// 线路编辑器内的 chip 交互（完成方式/风格）——通过事件委托处理
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.qr-comp');
  if (chip) {
    document.querySelectorAll(`.qr-comp[data-i="${chip.dataset.i}"]`).forEach((c) => c.classList.remove('active'));
    chip.classList.add('active');
    return;
  }
  const s = e.target.closest('.qr-style');
  if (s) { s.classList.toggle('active'); return; }
});

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  App.init();
  // 跨天时自动重渲染当前页（服役天数、今日概览等随日期自动刷新）
  if (!window.__climbDateWatcher) {
    let lastDay = todayStr();
    window.__climbDateWatcher = setInterval(() => {
      const now = todayStr();
      if (now !== lastDay) {
        lastDay = now;
        toast('新的一天，数据已自动刷新');
        App.navigate(App.page);
      }
    }, 5 * 60 * 1000);
  }
});

</script>
